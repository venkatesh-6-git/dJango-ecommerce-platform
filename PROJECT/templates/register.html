{% extends 'home.html' %}

{% block content %}
{% load static %}

<div class="r-container">

    <h2 style="color:blueviolet">Registration Form</h2>
    {% if messages %}
    {% for message in messages %}
        {% if message.tags == 'success' %}
            <p style="color: green;">{{ message }}</p>
        {% else %}
            <p style="color: red;">{{ message }}</p>
        {% endif %}
    {% endfor %}
{% endif %}

    <form class="r-form" method="POST">{% csrf_token %}
        <label for="username" class="username">Username</label><br>
        <input type="text" id="username" name="username" class='inpt' placeholder="Enter User Name" required>
        <br><br>

        <label for="email" class="email">Email</label><br>
        <input type="email" id="email" name="email" class='inpt' placeholder="Enter Email" required>
        <br><br>

        <label for="password" class="password">Password</label><br>
        <input type="password" id="password" name="password" class= 'inpt' placeholder="Enter Password" required><br>
        <button type="button" id="toggle" style="background-color: rgb(184, 13, 241); color:black; border-radius: 10px;">Show</button>
        <br><br>

        <button class='r-button' type="submit">Register</button>
    </form>
    </div>
    <script src="{% static 'script.js' %}"></script>

{% endblock %}
