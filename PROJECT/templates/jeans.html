{% extends 'home.html' %}
{% block content %}


    <div class="mobile-container">
        {% for i in data %}
        <div class="mobile-card">
            <div class="mobile-header">
            {% if forloop.counter == 1 %}
                <img src="/media/jeans/7.jpg" width="150" height="150">
                <form action="{% url 'add_to_wishlist' 'jeans' i.id %}"
                    method="POST" class="wishlist-form">
                    {% csrf_token %}
                    <button type="submit" class="wishlist-btn"
                            aria-label="Add to wishlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </form>

            {% else %}
                <img src="{{i.jeans_image.url}}"  height="150px" width="150px">
    
            {% endif %}
                

            </div>
            <div class="mobile-body">
                <h2>{{i.jeans_name}}</h2>
                <h5>{{i.jeans_description}}</h5>
            <div class="mobile-review">
                <div class="m">
                <h4>₹ {{i.jeans_price}}</h4>
                </div>
                <div class="m">
                <h3>⭐{{i.jeans_rating}}</h3>
                </div>
            </div>

            </div>

            <div class="mobile-footer">
                 <a href="{% url 'success' %}">
                 <button style="width:100px;">BuyNow</button>
                 </a>
                
                <a href="{% url 'add_cart' i.id 'jeans' %}">
                    <button type="button">Add to Cart</button>
                </a>
               
            </div>
        </div>
        {% endfor %}
    </div>


{% endblock %}
