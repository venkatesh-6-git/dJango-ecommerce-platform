{% extends 'home.html' %}
{% block content %}


    <div class="mobile-container">
        {% for i in data %}
        <div class="mobile-card">
            <div class="mobile-header">
                <img src="{{i.laptop_image.url}}" height="150px" width="150px">
                <form action="{% url 'add_to_wishlist' 'laptops' i.id %}"
                    method="POST" class="wishlist-form">
                    {% csrf_token %}
                    <button type="submit" class="wishlist-btn"
                            aria-label="Add to wishlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </form>

            </div>
            <div class="mobile-body">
                <h2>{{i.laptop_name}}</h2>
                <h6>{{i.laptop_description}}</h6>
            <div class="mobile-review">
                <div class="m">
                <h4>₹ {{i.laptop_price}}</h4>
                </div>
                <div class="m">
                <h3>⭐{{i.laptop_rating}}/5</h3>
                </div>
            </div>

            </div>

            <div class="mobile-footer">
                 <a href="{% url 'success' %}">
                 <button style="width:100px;">BuyNow</button>
                 </a>
                
                <a href="{% url 'add_cart' i.id 'laptops' %}">
                    <button type="button">Add to Cart</button>
                </a>
               
            </div>
        </div>
        {% endfor %}
    </div>


{% endblock %}
